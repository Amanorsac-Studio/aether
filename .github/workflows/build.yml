name: Build

# Windows and macOS release builds. The macOS job signs and notarises with the
# Developer ID held in repository/organisation secrets — the certificate never leaves
# GitHub's runner, and nothing here prints it.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE          base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD password for that .p12
#   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Amanorsac Studio (TEAMID)"
#   MACOS_NOTARY_APPLE_ID      Apple ID used for notarisation
#   MACOS_NOTARY_PASSWORD      app-specific password for that Apple ID
#   MACOS_NOTARY_TEAM_ID       10-character team id
#   MACOS_INSTALLER_IDENTITY   optional: "Developer ID Installer: ..." to also build a signed .pkg
# Windows signing is not wired up yet; add WINDOWS_CERTIFICATE the same way when the
# Authenticode certificate exists (Master Standard §5 lists it as a company P0).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No -G: the hosted image's Visual Studio version changes over time (pinning
      # "Visual Studio 17 2022" broke run #1 once the runner moved to a newer VS),
      # so let CMake pick whichever Visual Studio is actually installed.
      - name: Configure
        run: cmake -B build -A x64

      - name: Show the generator CMake picked
        run: |
          Select-String -Path build\CMakeCache.txt -Pattern "^CMAKE_GENERATOR(_PLATFORM)?:"
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --target AETHER_VST3 aether_dsp_test aether_license_test --parallel

      - name: DSP tests
        run: .\build\Release\aether_dsp_test.exe

      - name: Licence tests
        run: .\build\aether_license_test_artefacts\Release\aether_license_test.exe

      - name: Package installer
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1 -BuildDir build

      # Actually install and uninstall the thing on a real Windows runner. The payload
      # layout bug that broke the first real install could not be reproduced under
      # Wine, so "it links" and "it packages" are not enough evidence that it works.
      - name: Smoke-test install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = (Get-ChildItem dist\AETHER-*-Windows.exe | Select-Object -First 1).FullName
          $vst3 = Join-Path $env:RUNNER_TEMP 'smoke-vst3'
          $supp = Join-Path $env:RUNNER_TEMP 'smoke-support'

          # A WIN32-subsystem exe returns immediately from the shell, so wait explicitly.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/VST3=$vst3", "/D=$supp" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }

          $binary = Join-Path $vst3 'AETHER.vst3\Contents\x86_64-win\AETHER.vst3'
          if (-not (Test-Path -LiteralPath $binary)) {
              Write-Host "--- what landed in $vst3 ---"
              if (Test-Path $vst3) { Get-ChildItem -Recurse -Force $vst3 | Select-Object -ExpandProperty FullName }
              throw "Install produced no plugin at $binary"
          }
          Write-Host ("Installed: {0:N1} MB" -f ((Get-Item -LiteralPath $binary).Length / 1MB))

          $uninst = Join-Path $supp 'Uninstall AETHER.exe'
          if (-not (Test-Path -LiteralPath $uninst)) { throw "No uninstaller at $uninst" }
          $u = Start-Process -FilePath $uninst -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited $($u.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $vst3 'AETHER.vst3')) { throw 'Uninstall left the plugin behind' }
          Write-Host 'Uninstall OK'

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-windows
          path: |
            dist/AETHER-*-Windows.exe
            dist/AETHER-*-Windows.exe.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-14
    env:
      # Mapped here because the secrets context is not available in a step-level `if`.
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      # Xcode generator, to match the analog bundle's workflow.
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target AETHER_VST3 AETHER_AU aether_dsp_test aether_license_test --parallel

      - name: DSP tests
        run: ./build/Release/aether_dsp_test

      - name: Licence tests
        run: ./build/aether_license_test_artefacts/Release/aether_license_test

      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign, notarise and staple
        if: env.HAVE_SIGNING == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: bash tools/sign_macos.sh build/AETHER_artefacts/Release

      # Fails the job rather than quietly uploading nothing, as the analog bundle does.
      # Unconditional: every macOS build produces the installer. This used to live inside
      # tools/sign_macos.sh behind both HAVE_SIGNING and an optional INSTALLER_IDENTITY,
      # so no run ever produced one and the artefact was a pair of bare bundles.
      # Packaging Standard P1 (one file per platform) and P28 (the exact filename).
      - name: Build the macOS installer
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: bash installer/macos/build_pkg.sh build/AETHER_artefacts/Release 1.0.0

      - name: Notarise and staple the installer
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          PKG=dist/AETHER-1.0.0-macOS.pkg
          # notarytool --wait exits 0 even when Apple answers "Invalid", so read the status.
          RESULT=$(xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" \
                     --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" \
                     --wait --timeout 30m --output-format json)
          STATUS=$(printf '%s' "$RESULT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(printf '%s' "$RESULT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
            xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          spctl --assess -vv --type install "$PKG"

      # Fail rather than upload an installer-less build.
      - name: Check the installer exists
        run: test -f dist/AETHER-1.0.0-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-macos
          path: |
            dist/AETHER-1.0.0-macOS.pkg
            build/AETHER_artefacts/Release/VST3/AETHER.vst3
            build/AETHER_artefacts/Release/AU/AETHER.component
          if-no-files-found: error

      # A tagged release that came out unsigned would fail Gatekeeper on every
      # customer's machine, so say so loudly instead of shipping it quietly.
      - name: Refuse an unsigned release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_SIGNING != 'true'
        run: |
          echo "::error::This is a tagged release but no macOS signing secrets are set."
          echo "Add MACOS_CERTIFICATE and the notary secrets before tagging a release."
          exit 1
